<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Contact - Communauté Centre Eden</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <header class="navbar">
    <div class="logo">CC EDEN</div>
    <nav>
      <a href="index.html">Accueil</a>
      <a href="about.html">À propos</a>
      <a href="ministries.html">Ministères</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="contact-hero">
    <div class="container">
      <h1>Contactez-nous</h1>
      <p>Nous sommes heureux de vous entendre. Envoyez-nous un message et nous vous répondrons rapidement !</p>
    </div>
  </section>

  <!-- Contact Form + Images -->
  <section class="contact-content">
    <div class="container-flex">
      <div class="contact-form">
        <form action="mailto:ccentreeden@gmail.com" method="post" enctype="text/plain">
          <label for="name">Nom</label>
          <input type="text" id="name" name="name" placeholder="Votre nom" required>

          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Votre email" required>

          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Votre message..." required></textarea>

          <button type="submit">Envoyer</button>
        </form>
      </div>

      <div class="contact-images">
        <img src="img/church1.jpg" alt="Intérieur de l'église">
        <img src="img/church2.jpg" alt="Église extérieur">
        <img src="img/church3.jpg" alt="Communauté en prière">
      </div>
    </div>
  </section>

  <!-- Back Home Button -->
  <div class="back-home">
    <a href="index.html" class="btn-back">← Retour à la page d’accueil</a>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <p>&copy; 2026 Communauté Centre Eden. Tous droits réservés.</p>
  </footer>

</body>
</html>
